<div class="login-page">
  <div class="login-card">

    <div class="login-card__header">
      <div class="login-card__logo">TN</div>
      <h1 class="login-card__title">TaskNotes</h1>
      <p class="login-card__subtitle">Entre com sua conta</p>
    </div>

    <form class="login-form" (ngSubmit)="submit()" #f="ngForm" novalidate>

      <div class="login-form__field">
        <label class="login-form__label" for="username">Usuário</label>
        <input
          id="username"
          class="login-form__input"
          type="text"
          autocomplete="username"
          [(ngModel)]="username"
          name="username"
          placeholder="nome de usuário"
          [disabled]="isLoading()"
        />
      </div>

      <div class="login-form__field">
        <label class="login-form__label" for="password">Senha</label>
        <div class="login-form__password-wrap">
          <input
            id="password"
            class="login-form__input"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            [disabled]="isLoading()"
          />
          <button
            type="button"
            class="login-form__password-toggle"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            (click)="togglePassword()"
            [disabled]="isLoading()"
            tabindex="-1"
          >
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <label class="login-form__remember">
        <input
          type="checkbox"
          [(ngModel)]="rememberMe"
          name="rememberMe"
          [disabled]="isLoading()"
        />
        <span>Manter conectado</span>
      </label>

      @if (error()) {
        <p class="login-form__error">{{ error() }}</p>
      }

      <button
        type="submit"
        class="login-form__submit"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

  </div>
</div>
