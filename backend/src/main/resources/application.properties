# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Banco de dados ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ── Logs ──────────────────────────────────────────────────────────────────────
logging.level.com.tasknotes=DEBUG

# ── JWT ───────────────────────────────────────────────────────────────────────
# Minimum 32 chars (256 bits) for HS256. Override via JWT_SECRET env var in prod.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-00}
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=180

# ── Admin bootstrap (set via env vars; never hardcode) ────────────────────────
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.display-name=${ADMIN_DISPLAY_NAME:Admin}

# ── Refresh token cookie ──────────────────────────────────────────────────────
# Set COOKIE_SECURE=true and COOKIE_SAME_SITE=None in Railway (HTTPS + cross-domain)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# -- CORS --
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200}

# ── Smart Text Formatting MCP ─────────────────────────────────────────────────
app.smart-format.enabled=${SMART_FORMAT_ENABLED:false}
app.smart-format.mcp.url=${SMART_FORMAT_MCP_URL:http://localhost:8790/internal/format-note}
app.smart-format.timeout-ms=10000

# ── MCP Concepts Provider ─────────────────────────────────────────────────────
app.concepts.mcp.enabled=${MCP_CONCEPTS_ENABLED:false}
app.concepts.mcp.url=${MCP_CONCEPTS_URL:http://localhost:8787/internal/concepts/explain}
app.concepts.mcp.timeout-ms=5000
app.concepts.mcp.internet-fallback-enabled=false